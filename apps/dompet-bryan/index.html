<title>Dompet Bryan</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column under a solid ember hero, white cards with hairlines on grey, bottom tab bar with a raised Catat button; Beranda splits into two columns at 880px+.
   Restyled 21 Nov 2026 with unslop by Damir Sokolovsky (@heydamir, github.com/heydamir/unslop, CC BY 4.0): neutral graphite surfaces, the hero is the one bright thing,
   weights 400–600, 4px spacing grid, nested radii, one ease-out curve with no overshoot, "Rp" set small and muted like a printed receipt. */
:root {
  --bg: #F4F4F3; --card: #FFFFFF; --card-2: #F1F0EF; --ink: #171717; --ink-2: #4F4F4F; --muted: #6B6B6B;
  --line: #E8E7E5; --edge: #8A8A8A;
  --accent: #BF3F19; --on-accent: #FFFFFF; --btn: #171717; --on-btn: #FFFFFF;
  --out: #B42318; --in: #0B7A3B; --warn: #8A5A00;
  --out-mark: #D03B3B; --in-mark: #0CA30C; --ok-mark: #0CA30C; --warn-mark: #FAB219; --crit-mark: #D03B3B;
  --hero-a: #C4441C; --hero-b: #A93816;
  --glass: rgba(0, 0, 0, .16);
  --scrim: rgba(12, 10, 9, .46);
  --shadow: 0 1px 2px rgba(0, 0, 0, .05);
  --shadow-lift: 0 8px 24px rgba(0, 0, 0, .12);
  --s0: #8F8A84; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-xl: 20px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px; --r-ctl: 10px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --tabbar: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141415; --card: #1B1B1D; --card-2: #242426; --ink: #EDEDED; --ink-2: #A8A8AD; --muted: #8E8E93;
    --line: #2A2A2D; --edge: #636368;
    --accent: #FF7D4F; --on-accent: #1A1918; --btn: #EDEDED; --on-btn: #171717;
    --out: #FF8B7E; --in: #5ED49A; --warn: #F5C04A;
    --out-mark: #E66767; --in-mark: #2DB82D; --ok-mark: #2DB82D; --warn-mark: #FAB219; --crit-mark: #E66767;
    --hero-a: #B23E18; --hero-b: #942F11;
    --glass: rgba(0, 0, 0, .2);
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 0 0 transparent;
    --shadow-lift: 0 8px 24px rgba(0, 0, 0, .5);
    --s0: #77716A; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141415; --card: #1B1B1D; --card-2: #242426; --ink: #EDEDED; --ink-2: #A8A8AD; --muted: #8E8E93;
  --line: #2A2A2D; --edge: #636368;
  --accent: #FF7D4F; --on-accent: #1A1918; --btn: #EDEDED; --on-btn: #171717;
  --out: #FF8B7E; --in: #5ED49A; --warn: #F5C04A;
  --out-mark: #E66767; --in-mark: #2DB82D; --ok-mark: #2DB82D; --warn-mark: #FAB219; --crit-mark: #E66767;
  --hero-a: #B23E18; --hero-b: #942F11;
  --glass: rgba(0, 0, 0, .2);
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 0 0 transparent;
  --shadow-lift: 0 8px 24px rgba(0, 0, 0, .5);
  --s0: #77716A; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.45; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
.num, .tx-amt, td.n, .cal-v { font-variant-numeric: tabular-nums; }
/* the receipt mark: "Rp" smaller and quieter than the figure it belongs to */
.cur { font-size: .78em; font-weight: 500; opacity: .62; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 26px; height: 26px; }
[hidden] { display: none !important; } /* rules like .field{display:flex} would otherwise show hidden fields */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
#view { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; outline: none; }
#view.wide { max-width: 1040px; }
.page-head { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.page-head h1 { font-size: 28px; font-weight: 600; flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 18px; font-weight: 600; }
.link { background: none; border: 0; color: var(--accent); font-weight: 500; font-size: 15px; padding: 12px 4px; margin: -12px -4px; min-height: 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.out-t { color: var(--out); }
.in-t { color: var(--in); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--r-ctl); border: 0; font-weight: 500; font-size: 16px; background: var(--btn); color: var(--on-btn); }
.btn:active { transform: scale(.97); }
.btn.primary { min-height: 56px; width: 100%; }
.btn.soft { background: var(--card-2); color: var(--ink); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
.btn.danger { background: transparent; color: var(--out); border: 1px solid var(--out); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon-btn { width: 48px; height: 48px; border-radius: var(--r-md); border: 0; display: inline-grid; place-items: center; background: var(--card-2); color: var(--ink); flex: none; }
.icon-btn.on-hero { background: var(--glass); color: #fff; }

/* ---------- hero (Beranda) ---------- */
/* the one bright thing on the screen: solid ember with a slight tone shift inside the same hue, no washes, blobs or colored shadow */
.hero { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 20px; color: #FFFFFF; background: linear-gradient(180deg, var(--hero-a), var(--hero-b)); }
.hero-top { display: flex; align-items: flex-start; gap: 12px; }
.hero-hello { font-size: 16px; font-weight: 600; }
.hero-label { font-size: 14px; font-weight: 400; opacity: .85; margin-top: 4px; }
.hero-amount { font-size: clamp(34px, 9.5vw, 44px); font-weight: 600; letter-spacing: -.01em; line-height: 1.1; margin-top: 4px; word-break: break-word; }
.hero-month { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; position: relative; z-index: 1; background: var(--glass); border-radius: var(--r-md); }
.hm-cell { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; min-width: 0; }
.hm-cell + .hm-cell { border-left: 1px solid rgba(255, 255, 255, .18); }
.hm-k { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; opacity: .9; }
.hm-k .ic { width: 16px; height: 16px; }
.hm-cell b { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }

.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.quick::-webkit-scrollbar { display: none; }
.qchip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px 0 8px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); font-weight: 500; font-size: 15px; }
.qchip .dot { width: 32px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); }

/* ---------- wallet cards ---------- */
/* a 2-column grid at every width: a sideways carousel hid every wallet past the second */
.wallets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
/* quiet cards: the wallet's own color lives only in its icon tile, so the hero stays the one bright thing */
.wcard { --wc: #C8441B; min-width: 0; min-height: 104px; border-radius: var(--r-lg); border: 1px solid var(--line); padding: 16px; text-align: left; background: var(--card); color: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; box-shadow: var(--shadow); }
.wcard .wn { font-weight: 500; font-size: 15px; display: flex; gap: 8px; align-items: center; position: relative; min-width: 0; }
.wcard .wn > .ic:first-child { width: 28px; height: 28px; padding: 6px; border-radius: var(--r-sm); background: var(--wc); color: #FFFFFF; stroke-width: 2; }
.wcard .wn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wcard .wb { font-weight: 600; font-size: clamp(17px, 4.8vw, 20px); position: relative; overflow-wrap: anywhere; }
.wcard .wk { font-size: 13px; font-weight: 400; color: var(--muted); position: relative; }
.wcard.add { color: var(--ink-2); border: 1.5px dashed var(--edge); box-shadow: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; font-weight: 500; }
/* after an even number of wallets, Add wallet becomes a slim full-width row instead of a lone tile */
.wcard.add:nth-child(odd) { grid-column: 1 / -1; min-height: 56px; flex-direction: row; gap: 8px; }
.g-oranye { --wc: #C8441B; }
.g-merah { --wc: #C8323F; }
.g-biru { --wc: #2F67D8; }
.g-teal { --wc: #0E7F68; }
.g-ungu { --wc: #6A4BD6; }
.g-grafit { --wc: #45413D; }
.g-pink { --wc: #C23D7A; }
.g-hijau { --wc: #2F7D32; }
/* the color picker draws its swatches with these classes: there they fill the circle */
.colorpick span[class*="g-"] { background: var(--wc); }

/* ---------- lists & tx rows ---------- */
.list { display: flex; flex-direction: column; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 16px 4px 8px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
.group-head b { color: var(--ink); font-weight: 600; font-size: 15px; }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px; border: 0; background: var(--card); text-align: left; border-radius: 0; }
.tx-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.tx-wrap .tx + .tx { border-top: 1px solid var(--line); }
.tx:active { background: var(--card-2); }
.tx-ic { width: 40px; height: 40px; border-radius: var(--r-ctl); display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c, var(--s0)) 14%, var(--card)); color: color-mix(in srgb, var(--c, var(--s0)) 62%, var(--ink)); }
.tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx-title { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amt { font-weight: 500; font-size: 15px; white-space: nowrap; text-align: right; }
.tx-amt small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 0 8px; border-radius: 6px; background: var(--card-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }

.mrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 12px 16px; border: 0; background: var(--card); text-align: left; }
.mrow + .mrow { border-top: 1px solid var(--line); }
.mrow .chev { color: var(--muted); }
.mrow-t { font-weight: 500; }
.mrow-s { font-size: 14px; color: var(--muted); }

/* ---------- segmented / chips / forms ---------- */
.seg { display: flex; background: var(--card-2); border-radius: var(--r-md); padding: 4px; gap: 4px; }
.card .seg, dialog .seg { background: var(--card-2); }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: var(--r-sm); font-weight: 500; font-size: 15px; color: var(--ink-2); padding: 0 8px; text-align: center; }
.seg input:checked + span { background: var(--btn); color: var(--on-btn); }
.seg input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
#view > .seg { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip > span { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 8px; border-radius: var(--r-ctl); background: var(--card); border: 1px solid var(--edge); font-weight: 500; font-size: 15px; }
.chip > span .ck { display: none; }
.chip input:checked + span { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.chip input:checked + span .ck { display: inline; }
.chip input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.chip .cdot { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--s0)) 22%, var(--card)); color: color-mix(in srgb, var(--c, var(--s0)) 60%, var(--ink)); }
.chip-add { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: var(--r-ctl); background: transparent; border: 1.5px dashed var(--edge); color: var(--ink-2); font-weight: 500; font-size: 15px; }
.chip-add:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.cq { margin-top: 12px; }
#cq-done:empty { display: none; }
.chip input:checked + span .cdot { background: color-mix(in srgb, var(--c, var(--s0)) 40%, var(--btn)); color: var(--on-btn); }
.swatch { width: 28px; height: 28px; border-radius: 50%; flex: none; }

.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 500; font-size: 15px; }
.hint { font-size: 14px; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 48px; border: 1px solid var(--edge); border-radius: var(--r-ctl); background: var(--card); padding: 12px; font-size: 16px; }
textarea.input { min-height: 80px; resize: vertical; }
.money { display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge); border-radius: var(--r-ctl); padding: 0 12px; min-height: 48px; background: var(--card); }
.money:focus-within { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.money span { font-weight: 500; color: var(--ink-2); }
.money input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; min-height: 46px; font-size: 18px; font-weight: 600; }
.money.big { border: 0; padding: 0; background: transparent; min-height: 64px; }
.money.big span { font-size: 24px; }
.money.big input { font-size: 34px; font-weight: 600; min-height: 60px; }
.money.big:focus-within { outline: none; }
.money.big { border-bottom: 2px solid var(--line); border-radius: 0; }
.money.big:focus-within { border-bottom-color: var(--accent); }
.err { display: none; color: var(--out); font-size: 14px; font-weight: 500; align-items: center; gap: 6px; }
.err.on { display: flex; }
.field.bad .input, .field.bad .money { border-color: var(--out); }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.datechips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.datechips .input { width: auto; flex: 1; min-width: 160px; }

/* ---------- sheet ---------- */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 94dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--card); color: var(--ink); box-shadow: 0 -8px 32px rgba(0, 0, 0, .2); }
dialog.sheet::backdrop { background: var(--scrim); }
@media (min-width: 720px) { dialog.sheet { margin: auto; border-radius: var(--r-xl); } }
.sheet form { display: flex; flex-direction: column; max-height: 94dvh; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 18px; font-weight: 600; flex: 1; }
.sheet-body { padding: 16px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; overscroll-behavior: contain; }
.sheet-body.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 40px), transparent); mask-image: linear-gradient(#000 calc(100% - 40px), transparent); }
.wallet-line { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-top: -8px; padding: 0 2px; border: 0; background: none; color: var(--ink-2); font-size: 15px; font-weight: 500; text-align: left; }
.wallet-line b { color: var(--ink); font-weight: 600; }
.wallet-line .ic { color: var(--muted); }
.wl-change { color: var(--accent); font-weight: 500; font-size: 14px; }
.more-fields { border-radius: var(--r-md); background: var(--card-2); }
.more-fields > summary { list-style: none; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; cursor: pointer; font-weight: 500; font-size: 15px; }
.more-fields > summary::-webkit-details-marker { display: none; }
.more-fields > summary > .ic:last-child { color: var(--muted); transition: transform .18s var(--ease); }
.more-fields[open] > summary > .ic:last-child { transform: rotate(180deg); }
.more-fields > .stack { padding: 4px 12px 12px; gap: 16px; }
.sheet-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.sheet-foot .split { display: flex; justify-content: space-between; gap: 12px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: var(--tabbar); padding: 0 8px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; padding: 8px 0 8px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"] .ic { stroke-width: 2.2; }
.tab-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.tab[aria-current="page"] .tab-dot { background: var(--accent); }
.fab-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 8px; }
.fab { width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--bg); background: var(--btn); color: var(--on-btn); display: grid; place-items: center; margin-top: -24px; box-shadow: var(--shadow-lift); }
.fab:active { transform: scale(.97); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.fab-label { font-size: 12px; font-weight: 600; color: var(--ink); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: calc(100% - 32px); max-width: 520px; pointer-events: none; }
.toast-in { display: flex; align-items: center; gap: 12px; background: var(--btn); color: var(--on-btn); border-radius: var(--r-md); padding: 8px 8px 8px 16px; box-shadow: var(--shadow-lift); pointer-events: auto; min-height: 56px; }
.toast-in p { flex: 1; font-size: 15px; font-weight: 500; }
.toast-in button { background: transparent; color: var(--on-btn); border: 1.5px solid currentColor; border-radius: var(--r-sm); min-height: 44px; padding: 0 16px; font-weight: 600; }
