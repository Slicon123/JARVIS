<title>Dompet Bryan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column under a warm gradient hero, white rounded cards on soft grey, bottom tab bar with a raised Catat button; Beranda splits into two columns at 880px+. */
:root {
  --bg: #EDECEA; --card: #FFFFFF; --card-2: #F5F4F2; --ink: #1A1918; --ink-2: #57534E; --muted: #6F6A64;
  --line: #E3E0DB; --edge: #8A847D;
  --accent: #BF3F19; --on-accent: #FFFFFF; --btn: #1A1918; --on-btn: #FFFFFF;
  --out: #B42318; --in: #0B7A3B; --warn: #8A5A00;
  --out-mark: #D03B3B; --in-mark: #0CA30C; --ok-mark: #0CA30C; --warn-mark: #FAB219; --crit-mark: #D03B3B;
  --hero-a: #EC6A35; --hero-b: #C4401A; --hero-c: #8C2913;
  --glass: rgba(70, 18, 6, .24);
  --scrim: rgba(12, 10, 9, .46);
  --shadow: 0 1px 2px rgba(26, 25, 24, .05), 0 10px 28px rgba(26, 25, 24, .08);
  --shadow-lift: 0 8px 22px rgba(26, 25, 24, .28);
  --s0: #8F8A84; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --tabbar: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --card: #1E1C1A; --card-2: #282624; --ink: #F4F2EF; --ink-2: #BDB7B0; --muted: #A29C95;
    --line: #34312E; --edge: #77716A;
    --accent: #FF7D4F; --on-accent: #1A1918; --btn: #F4F2EF; --on-btn: #1A1918;
    --out: #FF8B7E; --in: #5ED49A; --warn: #F5C04A;
    --out-mark: #E66767; --in-mark: #2DB82D; --ok-mark: #2DB82D; --warn-mark: #FAB219; --crit-mark: #E66767;
    --hero-a: #D85A2A; --hero-b: #A83716; --hero-c: #5E1C0D;
    --glass: rgba(0, 0, 0, .26);
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
    --s0: #77716A; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --card: #1E1C1A; --card-2: #282624; --ink: #F4F2EF; --ink-2: #BDB7B0; --muted: #A29C95;
  --line: #34312E; --edge: #77716A;
  --accent: #FF7D4F; --on-accent: #1A1918; --btn: #F4F2EF; --on-btn: #1A1918;
  --out: #FF8B7E; --in: #5ED49A; --warn: #F5C04A;
  --out-mark: #E66767; --in-mark: #2DB82D; --ok-mark: #2DB82D; --warn-mark: #FAB219; --crit-mark: #E66767;
  --hero-a: #D85A2A; --hero-b: #A83716; --hero-c: #5E1C0D;
  --glass: rgba(0, 0, 0, .26);
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
  --s0: #77716A; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.45; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
.num, .tx-amt, td.n, .cal-v { font-variant-numeric: tabular-nums; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 26px; height: 26px; }
[hidden] { display: none !important; } /* rules like .field{display:flex} would otherwise show hidden fields */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
#view { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; outline: none; }
#view.wide { max-width: 1040px; }
.page-head { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 18px; font-weight: 700; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 15px; padding: 12px 4px; margin: -12px -4px; min-height: 48px; }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.out-t { color: var(--out); }
.in-t { color: var(--in); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; font-weight: 700; font-size: 16px; background: var(--btn); color: var(--on-btn); transition: transform .1s ease-out, opacity .15s; }
.btn:active { transform: scale(.97); }
.btn.primary { min-height: 56px; width: 100%; box-shadow: var(--shadow-lift); }
.btn.soft { background: var(--card-2); color: var(--ink); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
.btn.danger { background: transparent; color: var(--out); border: 1px solid var(--out); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon-btn { width: 48px; height: 48px; border-radius: 999px; border: 0; display: inline-grid; place-items: center; background: var(--card-2); color: var(--ink); flex: none; }
.icon-btn.on-hero { background: var(--glass); color: #fff; }

/* ---------- hero (Beranda) ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 20px 20px 18px; color: #FFFFFF;
  background: radial-gradient(110% 80% at 100% 0%, var(--hero-a) 0%, rgba(236, 106, 53, 0) 60%), linear-gradient(165deg, var(--hero-b) 0%, var(--hero-b) 45%, var(--hero-c) 100%);
  box-shadow: 0 14px 34px rgba(140, 41, 19, .28); }
.hero::after { content: ""; position: absolute; width: 240px; height: 240px; right: -70px; bottom: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 70%); pointer-events: none; }
.hero-top { display: flex; align-items: flex-start; gap: 12px; }
.hero-hello { font-size: 15px; font-weight: 600; }
.hero-label { font-size: 15px; font-weight: 500; margin-top: 10px; }
.hero-amount { font-size: clamp(32px, 9vw, 42px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 2px; word-break: break-word; }
.hero-month { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.pill-glass { background: var(--glass); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.pill-glass b { font-weight: 800; }

.quick { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 6px; }
.quick::-webkit-scrollbar { display: none; }
.qchip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 8px; border-radius: 999px; border: 0; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; }
.qchip .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); }

/* ---------- wallet cards ---------- */
.wallets { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin-inline: -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.wallets::-webkit-scrollbar { display: none; }
.wcard { scroll-snap-align: start; flex: none; width: 176px; min-height: 116px; border-radius: var(--r-lg); border: 0; padding: 14px 16px; text-align: left; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; box-shadow: 0 8px 20px rgba(26, 25, 24, .16); }
.wcard::before { content: ""; position: absolute; inset: auto -40px -60px auto; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 70%); }
.wcard .wn { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; position: relative; min-width: 0; }
.wcard .wn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wcard .wb { font-weight: 800; font-size: 20px; position: relative; letter-spacing: -.01em; }
.wcard .wk { font-size: 13px; font-weight: 600; opacity: .92; position: relative; }
.wcard.add { background: var(--card); color: var(--ink); border: 1.5px dashed var(--edge); box-shadow: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; font-weight: 700; }
.wcard.add::before { display: none; }
.g-oranye { background: radial-gradient(90% 90% at 100% 0%, #E2602D 0%, rgba(226, 96, 45, 0) 60%), linear-gradient(150deg, #C8441B, #8F2B12); }
.g-merah { background: radial-gradient(90% 90% at 100% 0%, #DA4B57 0%, rgba(218, 75, 87, 0) 60%), linear-gradient(150deg, #C8323F, #7E1626); }
.g-biru { background: radial-gradient(90% 90% at 100% 0%, #4C86EE 0%, rgba(76, 134, 238, 0) 60%), linear-gradient(150deg, #2F67D8, #1A3A8C); }
.g-teal { background: radial-gradient(90% 90% at 100% 0%, #1A9C80 0%, rgba(26, 156, 128, 0) 60%), linear-gradient(150deg, #0E7F68, #064A3D); }
.g-ungu { background: radial-gradient(90% 90% at 100% 0%, #8467EA 0%, rgba(132, 103, 234, 0) 60%), linear-gradient(150deg, #6A4BD6, #382591); }
.g-grafit { background: radial-gradient(90% 90% at 100% 0%, #5B5752 0%, rgba(91, 87, 82, 0) 60%), linear-gradient(150deg, #45413D, #161412); }
.g-pink { background: radial-gradient(90% 90% at 100% 0%, #D45792 0%, rgba(212, 87, 146, 0) 60%), linear-gradient(150deg, #C23D7A, #761E4B); }
.g-hijau { background: radial-gradient(90% 90% at 100% 0%, #3F9443 0%, rgba(63, 148, 67, 0) 60%), linear-gradient(150deg, #2F7D32, #18471B); }

/* ---------- lists & tx rows ---------- */
.list { display: flex; flex-direction: column; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 4px 6px; font-size: 14px; color: var(--ink-2); font-weight: 600; }
.group-head b { color: var(--ink); font-weight: 700; font-size: 15px; }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 12px; border: 0; background: var(--card); text-align: left; border-radius: 0; }
.tx-wrap { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.tx-wrap .tx + .tx { border-top: 1px solid var(--line); }
.tx:active { background: var(--card-2); }
.tx-ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c, var(--s0)) 18%, var(--card)); color: color-mix(in srgb, var(--c, var(--s0)) 62%, var(--ink)); }
.tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx-title { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amt { font-weight: 700; font-size: 15.5px; white-space: nowrap; text-align: right; }
.tx-amt small { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }

.mrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; border: 0; background: var(--card); text-align: left; }
.mrow + .mrow { border-top: 1px solid var(--line); }
.mrow .chev { color: var(--muted); }
.mrow-t { font-weight: 700; }
.mrow-s { font-size: 14px; color: var(--muted); }

/* ---------- segmented / chips / forms ---------- */
.seg { display: flex; background: var(--card-2); border-radius: 999px; padding: 4px; gap: 4px; }
.card .seg, dialog .seg { background: var(--card-2); }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 999px; font-weight: 700; font-size: 15px; color: var(--ink-2); padding: 0 10px; text-align: center; }
.seg input:checked + span { background: var(--btn); color: var(--on-btn); }
.seg input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
#view > .seg { background: var(--card); box-shadow: var(--shadow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip > span { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--edge); font-weight: 600; font-size: 15px; }
.chip > span .ck { display: none; }
.chip input:checked + span { background: var(--btn); color: var(--on-btn); border-color: var(--btn); font-weight: 700; }
.chip input:checked + span .ck { display: inline; }
.chip input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.chip .cdot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--s0)) 22%, var(--card)); color: color-mix(in srgb, var(--c, var(--s0)) 60%, var(--ink)); }
.chip-add { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 12px; border-radius: 999px; background: transparent; border: 1.5px dashed var(--edge); color: var(--ink-2); font-weight: 600; font-size: 15px; }
.chip-add:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.cq { margin-top: 10px; }
#cq-done:empty { display: none; }
.chip input:checked + span .cdot { background: color-mix(in srgb, var(--c, var(--s0)) 40%, var(--btn)); color: var(--on-btn); }
.swatch { width: 26px; height: 26px; border-radius: 50%; flex: none; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: 15px; }
.hint { font-size: 14px; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 48px; border: 1px solid var(--edge); border-radius: 14px; background: var(--card); padding: 10px 14px; font-size: 16px; }
textarea.input { min-height: 80px; resize: vertical; }
.money { display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge); border-radius: 14px; padding: 0 14px; min-height: 48px; background: var(--card); }
.money:focus-within { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.money span { font-weight: 700; color: var(--ink-2); }
.money input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; min-height: 46px; font-size: 18px; font-weight: 700; }
.money.big { border: 0; padding: 0; background: transparent; min-height: 64px; }
.money.big span { font-size: 26px; }
.money.big input { font-size: 34px; font-weight: 800; letter-spacing: -.01em; min-height: 60px; }
.money.big:focus-within { outline: none; }
.money.big { border-bottom: 2px solid var(--line); border-radius: 0; }
.money.big:focus-within { border-bottom-color: var(--accent); }
.err { display: none; color: var(--out); font-size: 14px; font-weight: 600; align-items: center; gap: 6px; }
.err.on { display: flex; }
.field.bad .input, .field.bad .money { border-color: var(--out); }
.check { display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.datechips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.datechips .input { width: auto; flex: 1; min-width: 160px; }

/* ---------- sheet ---------- */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 94dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--card); color: var(--ink); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
dialog.sheet[open] { animation: sheet-in .22s ease-out; }
dialog.sheet::backdrop { background: var(--scrim); }
@keyframes sheet-in { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 720px) { dialog.sheet { margin: auto; border-radius: var(--r-xl); } }
.sheet form { display: flex; flex-direction: column; max-height: 94dvh; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 19px; font-weight: 800; flex: 1; }
.sheet-body { padding: 16px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sheet-foot { padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sheet-foot .split { display: flex; justify-content: space-between; gap: 12px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -6px 24px rgba(26, 25, 24, .06); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: var(--tabbar); padding: 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 6px 0 10px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 800; }
.tab[aria-current="page"] .ic { stroke-width: 2.3; }
.tab-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.tab[aria-current="page"] .tab-dot { background: var(--accent); }
.fab-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-bottom: 10px; }
.fab { width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--bg); background: var(--btn); color: var(--on-btn); display: grid; place-items: center; margin-top: -26px; box-shadow: var(--shadow-lift); }
.fab:active { transform: scale(.95); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.fab-label { font-size: 12.5px; font-weight: 700; color: var(--ink); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: calc(100% - 32px); max-width: 520px; pointer-events: none; }
.toast-in { display: flex; align-items: center; gap: 12px; background: var(--btn); color: var(--on-btn); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: var(--shadow-lift); pointer-events: auto; animation: toast-in .2s ease-out; min-height: 56px; }
.toast-in p { flex: 1; font-size: 15px; font-weight: 600; }
.toast-in button { background: transparent; color: var(--on-btn); border: 1.5px solid currentColor; border-radius: 999px; min-height: 44px; padding: 0 16px; font-weight: 800; }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- calendar ---------- */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav h2 { font-size: 18px; font-weight: 800; text-align: center; flex: 1; }
.sumline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--ink-2); font-weight: 600; }
.sumline b { font-weight: 800; }
